[workspace]
resolver = "2"
members = [
  "crates/vyapaar-exec-core",
  "crates/vyapaar-exec-auth",
  "crates/vyapaar-exec-router",
  "crates/vyapaar-exec-slicer",
  "crates/vyapaar-exec-audit",
  "crates/vyapaar-exec-zerodha",
  "crates/vyapaar-exec-upstox",
  "crates/vyapaar-exec-angelone",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/vyapaar-labs/vyapaar-exec"

[workspace.dependencies]
# Canonical vyapaar-labs dependencies (Tier 0 shared kernel + Tier 1A risk gate).
vyapaar-core = { path = "../vyapaar-core" }
vyapaar-risk = { path = "../vyapaar-risk" }

# Internal bounded-context crates (execution gateway).
vyapaar-exec-core = { path = "crates/vyapaar-exec-core" }
vyapaar-exec-auth = { path = "crates/vyapaar-exec-auth" }
vyapaar-exec-slicer = { path = "crates/vyapaar-exec-slicer" }
vyapaar-exec-router = { path = "crates/vyapaar-exec-router" }
vyapaar-exec-audit = { path = "crates/vyapaar-exec-audit" }
vyapaar-exec-zerodha = { path = "crates/vyapaar-exec-zerodha" }
vyapaar-exec-upstox = { path = "crates/vyapaar-exec-upstox" }
vyapaar-exec-angelone = { path = "crates/vyapaar-exec-angelone" }

# External dependencies ported from the honba-te workspace manifest.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
rust_decimal = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1.12"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
parquet = { version = "53", features = ["arrow"] }
arrow = "53"
prometheus = { version = "0.13", features = ["process"] }
once_cell = "1"
opentelemetry = { version = "0.27", features = ["trace"] }
tracing-opentelemetry = "0.28"
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"
